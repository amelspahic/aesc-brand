<!-- The full mark. `currentColor`, so it is correct on gold, ink, teal and paper with no variant.
     Set a colour on the parent; never hard-code one here. Minimum 32px / 12mm — below that use
     znak-mali.svg, whose ring is removed because its stroke falls under 2px and turns to haze. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AESC">
  <g fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round">
    <path d="M53.65 19.5A25 25 0 1 1 10.35 44.5"/>
    <path d="M10.35 19.5A25 25 0 0 1 53.65 44.5"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23 41 32 22l9 19"/>
    <path d="M26 35h12"/>
  </g>
</svg>
